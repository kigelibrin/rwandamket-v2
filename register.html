<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | RWANDAMKET</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="auth-page">

<div class="container">

<div class="auth-card">

<h1>

Create Account

</h1>

<form id="registerForm">

<input
type="text"
id="fullName"
placeholder="Full Name"
required>

<input
type="email"
id="registerEmail"
placeholder="Email"
required>

<input
type="tel"
id="phone"
placeholder="Phone Number">

<input
type="password"
id="registerPassword"
placeholder="Password"
required>

<button
type="submit"
class="btn-primary">

Create Account

</button>

</form>

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="database.js"></script>

<script src="auth.js"></script>

</body>

</html>
