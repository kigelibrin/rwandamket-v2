<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vendor Dashboard | RWANDAMKET</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

<div class="container">

<h1>Vendor Dashboard</h1>

<button
class="btn-secondary"
id="logoutButton">

Logout

</button>

</div>

</header>

<main class="container">

<section class="dashboard-summary">

<div class="dashboard-card">

<h3>Business</h3>

<p id="businessName">Loading...</p>

</div>

<div class="dashboard-card">

<h3>Wallet</h3>

<p id="walletBalance">0 RWF</p>

</div>

<div class="dashboard-card">

<h3>Escrow</h3>

<p id="escrowBalance">0 RWF</p>

</div>

<div class="dashboard-card">

<h3>Service</h3>

<p id="serviceType">Loading...</p>

</div>

</section>

<section class="dashboard-actions">

<button
class="btn-primary"
onclick="window.location.href='vendor-products.html'">

Products

</button>

<button
class="btn-primary"
onclick="window.location.href='vendor-orders.html'">

Orders

</button>

<button
class="btn-primary"
onclick="window.location.href='vendor-wallet.html'">

Wallet

</button>

<button
class="btn-primary"
onclick="window.location.href='vendor-analytics.html'">

Analytics

</button>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="database.js"></script>

<script src="vendor.js"></script>

</body>

</html>
