<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | RWANDAMKET</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="auth-page">

<div class="container">

<div class="auth-card">

<h1>

Welcome Back

</h1>

<p>

Sign in to your RWANDAMKET account

</p>

<form id="loginForm">

<input
type="email"
id="loginEmail"
placeholder="Email"
required>

<input
type="password"
id="loginPassword"
placeholder="Password"
required>

<button
type="submit"
class="btn-primary">

Login

</button>

</form>

<p>

Don't have an account?

<a href="register.html">

Create one

</a>

</p>

</div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="database.js"></script>

<script src="auth.js"></script>

</body>

</html>
